name: Publish portfolio reports

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-academic-report.yml"
      - "projects/academic_success/report/**"
      - "projects/academic_success/src/**"
      - "projects/recommendation_showcase/report/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/academic_success/report/requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install report dependencies
        run: python -m pip install -r projects/academic_success/report/requirements.txt

      - name: Register report kernel
        run: python -m ipykernel install --user --name academic-success --display-name "Python (academic-success)"

      - name: Download Kaggle training data
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PYTHONPATH: projects/academic_success/src
        run: python -c "from academic_success.data import download_train; print(download_train())"

      - name: Render HTML and PDF reports
        run: quarto render projects/academic_success/report/report.qmd

      - name: Verify report artifacts
        run: |
          test -s projects/academic_success/report/report.html
          test -s projects/academic_success/report/report.pdf
          grep -q 'href="report.pdf"' projects/academic_success/report/report.html
          test -s projects/recommendation_showcase/report/report.html
          test -s projects/recommendation_showcase/report/report.pdf
          grep -q 'href="report.pdf"' projects/recommendation_showcase/report/report.html

      - name: Prepare Pages site
        run: |
          mkdir -p _site/recommendation_showcase
          cp projects/academic_success/report/report.html _site/index.html
          cp projects/academic_success/report/report.pdf _site/report.pdf
          cp projects/recommendation_showcase/report/report.html _site/recommendation_showcase/index.html
          cp projects/recommendation_showcase/report/report.pdf _site/recommendation_showcase/report.pdf

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
